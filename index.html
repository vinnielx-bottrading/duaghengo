<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<title>Ghe Ngo – Nhịp Chèo Đồng Lòng</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;600;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --maroon:#3a0e0c; --maroon2:#5a1712; --gold:#e8b33a; --gold2:#ffd66b; --cream:#fff4dc;
  --ink:#2a160b; --green:#1f7a3a; --shade:rgba(12,5,2,.55);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:#1a0b06;font-family:'Be Vietnam Pro',system-ui,sans-serif;color:var(--cream);user-select:none;-webkit-user-select:none;touch-action:none}
canvas{position:fixed;inset:0;display:block}
.ov{position:fixed;inset:0;display:none;align-items:center;justify-content:center;padding:16px;background:var(--shade);z-index:10}
.ov.show{display:flex}
.ov.clear{background:transparent}
.panel{position:relative;width:min(520px,100%);max-height:calc(100vh - 32px);overflow:auto;background:linear-gradient(180deg,var(--maroon2),var(--maroon));border:2px solid var(--gold);border-radius:18px;padding:22px 22px 20px;box-shadow:0 18px 50px rgba(0,0,0,.5),inset 0 0 0 5px rgba(232,179,58,.14);text-align:center}
.panel::before,.panel::after{content:"";position:absolute;left:18px;right:18px;height:8px;background:repeating-linear-gradient(90deg,var(--gold) 0 8px,transparent 8px 12px,var(--gold2) 12px 16px,transparent 16px 20px);opacity:.55;border-radius:4px}
.panel::before{top:8px}.panel::after{bottom:8px}
.panel.wide{width:min(760px,100%)}
h1{font-size:clamp(44px,9vw,78px);font-weight:900;letter-spacing:.06em;color:var(--gold2);text-shadow:0 3px 0 #8a3b0b,0 8px 24px rgba(0,0,0,.5);line-height:1}
h2{font-size:24px;font-weight:800;color:var(--gold2);margin:6px 0 12px}
h3{font-size:15px;font-weight:600;color:var(--gold);margin:14px 0 8px;text-transform:uppercase;letter-spacing:.08em}
.kicker{font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:var(--gold);margin:8px 0 10px}
.sub{font-size:20px;font-weight:600;margin:8px 0 22px;color:var(--cream)}
p{line-height:1.6;font-size:15.5px;text-align:left}
.btn{display:inline-block;font:inherit;font-weight:800;font-size:16px;color:var(--ink);background:linear-gradient(180deg,var(--gold2),var(--gold));border:none;border-radius:999px;padding:12px 26px;margin:6px;cursor:pointer;box-shadow:0 4px 0 #8a5a12;transition:transform .08s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #8a5a12}
.btn.big{font-size:19px;padding:14px 38px}
.btn.ghost{background:transparent;color:var(--gold2);box-shadow:none;border:1.5px solid var(--gold)}
.btn.sm{font-size:13px;padding:8px 14px}
.btn[disabled]{opacity:.4;pointer-events:none}
.teams{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin:6px 0}
.team{border:2px solid transparent;border-radius:14px;padding:10px 8px;background:rgba(0,0,0,.25);cursor:pointer;font-weight:600;font-size:14px}
.team.sel{border-color:var(--gold2);background:rgba(232,179,58,.16)}
.team .sw{height:26px;border-radius:13px 13px 5px 5px;margin-bottom:8px;position:relative;overflow:hidden}
.team .sw i{position:absolute;left:0;right:0;bottom:5px;height:6px}
.seg{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.seg button{font:inherit;font-weight:600;font-size:14px;color:var(--cream);background:rgba(0,0,0,.25);border:2px solid transparent;border-radius:999px;padding:9px 16px;cursor:pointer}
.seg button.sel{border-color:var(--gold2);background:rgba(232,179,58,.16)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:space-between;margin-bottom:6px}
.row h2{margin:0;flex:1;text-align:left}
.stagelist{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.stage{position:relative;background:rgba(0,0,0,.28);border:1.5px solid rgba(232,179,58,.5);border-radius:14px;padding:12px 10px;cursor:pointer;text-align:left;min-height:120px}
.stage .n{font-size:12px;color:var(--gold);font-weight:800;letter-spacing:.1em}
.stage .t{font-size:16px;font-weight:800;margin:4px 0 4px;color:var(--cream)}
.stage .d{font-size:12.5px;opacity:.85;line-height:1.4}
.stage .st{position:absolute;right:10px;top:10px;font-size:14px;color:var(--gold2);letter-spacing:1px}
.stage.lock{opacity:.4;cursor:default}
.stars{font-size:44px;letter-spacing:6px;color:var(--gold2);margin:4px 0 10px;text-shadow:0 3px 0 #8a3b0b}
.stars .off{color:rgba(255,255,255,.18);text-shadow:none}
.stats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:6px 0 14px}
.stats div{background:rgba(0,0,0,.25);border-radius:12px;padding:8px 14px;font-size:13px}
.stats b{display:block;font-size:20px;color:var(--gold2)}
.cardp{background:linear-gradient(180deg,#fff4dc,#f3dfb4);color:var(--ink);border-color:#a8741a}
.cardp h2{color:#7a1d10}
.cardp .kicker{color:#a8741a}
.cardp p{color:#3a2412}
.dyk{margin:14px 0 4px;padding:12px 14px;border-radius:12px;background:rgba(122,29,16,.08);border-left:4px solid #b8231b;text-align:left;font-size:14.5px;line-height:1.55;color:#4a2a12}
.dyk b{color:#7a1d10}
.draft{font-size:11.5px;color:#8a6a3a;margin:12px 0 4px;font-style:italic}
.cardp .btn.ghost{color:#7a1d10;border-color:#a8741a}
.opts{display:grid;gap:8px;margin:12px 0}
.opt{font:inherit;font-size:15px;font-weight:600;text-align:left;padding:12px 14px;border-radius:12px;border:2px solid #c9a35a;background:#fffaf0;color:var(--ink);cursor:pointer}
.opt.ok{background:#dff3d6;border-color:#3d8b2f}
.opt.no{background:#fbe0dc;border-color:#b8231b}
.fb{min-height:22px;font-size:14.5px;line-height:1.5;color:#3a2412;text-align:left}
.album{display:grid;gap:8px;margin:10px 0;text-align:left}
.album button{font:inherit;text-align:left;padding:12px 14px;border-radius:12px;border:1.5px solid rgba(232,179,58,.6);background:rgba(0,0,0,.25);color:var(--cream);cursor:pointer;font-size:15px;font-weight:600}
.album button span{display:block;font-size:12px;font-weight:400;opacity:.75;margin-top:2px}
.album button[disabled]{opacity:.45;cursor:default}
#hudBtns{position:fixed;top:max(10px,env(safe-area-inset-top));right:max(10px,env(safe-area-inset-right));display:flex;gap:8px;z-index:20}
#hudBtns button{width:42px;height:42px;border-radius:50%;border:2px solid var(--gold);background:rgba(58,14,12,.8);color:var(--gold2);font:inherit;font-weight:900;font-size:16px;cursor:pointer}
#pauseBtn{display:none}
#rotate{z-index:50;background:#1a0b06;flex-direction:column;gap:14px;text-align:center;font-weight:600}
#rotate .ph{width:46px;height:78px;border:3px solid var(--gold);border-radius:10px;animation:rot 2s infinite}
@keyframes rot{0%,30%{transform:rotate(0)}60%,100%{transform:rotate(-90deg)}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hudBtns">
  <button id="soundBtn" title="Âm thanh">♪</button>
  <button id="pauseBtn" title="Tạm dừng">II</button>
</div>

<div id="menu" class="ov show clear">
  <div class="panel">
    <div class="kicker">Di sản văn hóa Khmer Nam Bộ</div>
    <h1>GHE NGO</h1>
    <div class="sub">Nhịp chèo đồng lòng</div>
    <button class="btn big" data-act="start">Bắt đầu</button><br>
    <button class="btn ghost" data-act="album">Sổ tay văn hóa</button>
  </div>
</div>

<div id="setup" class="ov">
  <div class="panel wide">
    <h2>Chọn đội ghe của bạn</h2>
    <div id="teamList" class="teams"></div>
    <h3>Đội thi đấu</h3>
    <div class="seg" id="genderSeg">
      <button data-g="nam">Đội nam · 1.200 m</button>
      <button data-g="nu">Đội nữ · 1.000 m</button>
    </div>
    <div style="margin-top:16px"><button class="btn big" data-act="toStages">Vào lễ hội</button></div>
  </div>
</div>

<div id="stages" class="ov">
  <div class="panel wide">
    <div class="row">
      <h2>Hành trình lễ hội</h2>
      <button class="btn ghost sm" data-act="album">Sổ tay văn hóa</button>
      <button class="btn ghost sm" data-act="setup">Đổi đội</button>
    </div>
    <div id="stageList" class="stagelist"></div>
  </div>
</div>

<div id="result" class="ov">
  <div class="panel">
    <div class="kicker" id="resKicker"></div>
    <h2 id="resTitle"></h2>
    <div class="stars" id="resStars"></div>
    <div class="stats" id="resStats"></div>
    <div>
      <button class="btn ghost" data-act="retry">Chơi lại</button>
      <button class="btn" id="resNext" data-act="toCard">Mở thẻ văn hóa</button>
    </div>
  </div>
</div>

<div id="card" class="ov">
  <div class="panel cardp">
    <div class="kicker" id="cardKicker"></div>
    <h2 id="cardTitle"></h2>
    <p id="cardBody"></p>
    <div class="dyk" id="cardDyk"></div>
    <div class="draft">Nội dung nháp – sẽ được chuyên gia văn hóa Khmer kiểm duyệt.</div>
    <div style="margin-top:10px">
      <button class="btn" id="cardQuizBtn" data-act="toQuiz">Trả lời câu hỏi</button>
      <button class="btn ghost" id="cardBackBtn" data-act="albumBack">Đóng</button>
    </div>
  </div>
</div>

<div id="quiz" class="ov">
  <div class="panel cardp">
    <div class="kicker">Kiểm tra nhanh</div>
    <h2 id="quizQ" style="font-size:20px"></h2>
    <div class="opts" id="quizOpts"></div>
    <div class="fb" id="quizFb"></div>
    <div style="margin-top:10px"><button class="btn" id="quizNext" data-act="quizDone" disabled>Tiếp tục</button></div>
  </div>
</div>

<div id="album" class="ov">
  <div class="panel">
    <h2>Sổ tay văn hóa</h2>
    <div class="album" id="albumList"></div>
    <button class="btn ghost" data-act="albumClose">Quay lại</button>
  </div>
</div>

<div id="pause" class="ov">
  <div class="panel">
    <h2>Tạm dừng</h2>
    <button class="btn big" data-act="resume">Tiếp tục</button><br>
    <button class="btn ghost" data-act="retry">Chơi lại</button>
    <button class="btn ghost" data-act="toStages">Về bản đồ</button>
  </div>
</div>

<div id="rotate" class="ov">
  <div class="ph"></div>
  <div>Xoay ngang điện thoại để chơi</div>
</div>

<script>
'use strict';
/* ================== DỮ LIỆU ================== */
const TEAMS=[
  {name:'Ghe Sen Vàng',  hull:'#1f7a3a',band:'#f2c230',trim:'#ffd75e',shirt:'#f4cf2a',cap:'#f6d232',paddle:'#e8432c'},
  {name:'Ghe Naga Đỏ',   hull:'#b8231b',band:'#1d6b36',trim:'#ffcf4a',shirt:'#f36b1c',cap:'#d8231b',paddle:'#f5b52a'},
  {name:'Ghe Rồng Xanh', hull:'#164a8c',band:'#efe6c8',trim:'#ffd04d',shirt:'#2f7fd6',cap:'#ffffff',paddle:'#f3c63a'},
  {name:'Ghe Hồng Liên', hull:'#7a1f5c',band:'#f0a9d0',trim:'#ffd04d',shirt:'#e64aa0',cap:'#ff8ccc',paddle:'#ffe066'},
  {name:'Ghe Sóng Bạc',  hull:'#2b2b2b',band:'#d9d9d9',trim:'#f1c84b',shirt:'#d7ecff',cap:'#1c3f73',paddle:'#e85b2a'},
];
// Hệ số tốc độ đối thủ (m/s)
const STAGES=[
  {type:'race',  name:'Tập chèo',          desc:'Làm quen nhịp còi của người chỉ huy', dist:400, bpm:88, sprintBpm:96, opp:[], tutorial:true},
  {type:'launch',name:'Hạ thủy ghe',       desc:'Cả phum sóc cùng đẩy ghe xuống sông',  beats:16, bpm:84},
  {type:'race',  name:'Vòng loại',         desc:'Tranh vé vào chung kết',              bpm:100, sprintBpm:120, opp:[13.6,14.8,15.8]},
  {type:'lantern',name:'Đêm rằm tháng Mười',desc:'Cúng trăng và thả đèn nước',         beats:20, bpm:76},
  {type:'race',  name:'Chung kết',         desc:'Cuộc đua quyết định',                 bpm:108, sprintBpm:132, opp:[16.4,17.2,17.9]},
];
const CARDS=[
  {title:'Ghe Ngo là gì?',
   body:'Ghe Ngo là loại thuyền đua truyền thống của đồng bào Khmer Nam Bộ. Thân ghe dài và thon, mũi và đuôi cong vút, hai bên mạn vẽ hoa văn rực rỡ. Mỗi chiếc ghe thường gắn với một ngôi chùa và cộng đồng phum sóc quanh chùa: cả xóm cùng góp sức, cùng tập luyện và cùng cổ vũ.',
   dyk:'<b>Bạn có biết?</b> Đua ghe Ngo là cuộc thi của sự đồng lòng: hàng chục tay chèo phải nhịp nhàng như một người. Chèo khỏe mà lệch nhịp thì ghe vẫn chậm.',
   q:'Mỗi chiếc ghe Ngo thường gắn với điều gì?',
   opts:['Một ngôi chùa và cộng đồng phum sóc','Một công ty du lịch','Một gia đình duy nhất'],ans:0,
   ex:'Ghe Ngo là tài sản chung của cộng đồng, thường gắn với ngôi chùa của phum sóc.'},
  {title:'Đưa ghe xuống nước',
   body:'Ngoài mùa lễ hội, ghe Ngo được cất giữ cẩn thận trong khuôn viên chùa. Khi mùa đua đến gần, bà con trong phum sóc cùng nhau khiêng, đẩy ghe xuống sông và làm lễ cầu mong bình an, may mắn cho đội ghe.',
   dyk:'<b>Bạn có biết?</b> Một chiếc ghe Ngo rất dài và nặng nên phải có rất nhiều người cùng góp sức mới đưa được ghe xuống nước.',
   q:'Ngoài mùa lễ hội, ghe Ngo thường được cất giữ ở đâu?',
   opts:['Dưới đáy sông','Trong khuôn viên chùa','Tại sân vận động'],ans:1,
   ex:'Ghe được giữ trong khuôn viên chùa và chỉ đưa xuống nước khi mùa lễ hội đến.'},
  {title:'Mỗi người một vai',
   body:'Một đội ghe thường có 70–80 người, tính cả tay chèo dự bị. Người ngồi mũi ghe thường là người có uy tín. Người chỉ huy dùng còi hoặc chiêng để giữ nhịp và thúc giục cả đội. Một cặp tay chèo giữ nhịp để những người phía sau chèo theo. Ở đuôi ghe có người lái giữ hướng. Gần đích, các tay chèo quỳ dồn sức để bứt tốc.',
   dyk:'<b>Bạn có biết?</b> Tiếng còi và tiếng chiêng bạn nghe trong game chính là "nhịp tim" của chiếc ghe: cả đội chèo theo hiệu lệnh đó.',
   q:'Trên ghe, ai dùng còi hoặc chiêng để giữ nhịp cho cả đội?',
   opts:['Khán giả trên bờ','Trọng tài','Người chỉ huy'],ans:2,
   ex:'Người chỉ huy dùng còi hoặc chiêng để giữ nhịp và thúc giục các tay chèo.'},
  {title:'Lễ Oóc Om Bóc',
   body:'Oóc Om Bóc là lễ cúng trăng của người Khmer, diễn ra vào dịp rằm tháng 10 âm lịch, khi mùa lúa vừa thu hoạch xong. Người Khmer tin Mặt Trăng điều khiển mưa gió, mang lại mùa màng tươi tốt. Mâm cúng có khoai, chuối, dừa và không thể thiếu cốm dẹp. Sau lễ, mọi người cùng chia nhau thưởng thức. Đêm lễ hội còn có đèn nước lung linh trên sông.',
   dyk:'<b>Bạn có biết?</b> Cốm dẹp được làm từ nếp non rang rồi giã dẹp, là món dâng lên Mặt Trăng trong đêm lễ.',
   q:'Món không thể thiếu trong mâm cúng trăng Oóc Om Bóc là gì?',
   opts:['Cốm dẹp','Bánh chưng','Bánh trung thu'],ans:0,
   ex:'Cốm dẹp là lễ vật bắt buộc trong mâm cúng trăng của người Khmer.'},
  {title:'Di sản của cộng đồng',
   body:'Lễ hội Oóc Om Bóc – Đua ghe Ngo được công nhận là Di sản văn hóa phi vật thể quốc gia năm 2015. Giải đua ghe Ngo ở Sóc Trăng năm 2024 có 60 đội với gần 7.200 vận động viên; cự ly đua 1.200 m với nam và 1.000 m với nữ. Hơn cả một cuộc đua, lễ hội là dịp gắn kết cộng đồng và gìn giữ bản sắc văn hóa Khmer.',
   dyk:'<b>Bạn có biết?</b> Không chỉ có đội nam, các đội ghe nữ cũng tranh tài sôi nổi trên sông mỗi mùa lễ hội.',
   q:'Lễ hội Oóc Om Bóc – Đua ghe Ngo được công nhận Di sản văn hóa phi vật thể quốc gia năm nào?',
   opts:['2005','2015','2020'],ans:1,
   ex:'Lễ hội được đưa vào danh mục Di sản văn hóa phi vật thể quốc gia năm 2015.'},
];

/* ================== LƯU TIẾN ĐỘ ================== */
const SKEY='gheNgo.v1';
let SAVE={stars:[0,0,0,0,0],cards:[false,false,false,false,false],team:0,gender:'nam'};
try{const s=JSON.parse(localStorage.getItem(SKEY));if(s)SAVE=Object.assign(SAVE,s);}catch(e){}
function save(){try{localStorage.setItem(SKEY,JSON.stringify(SAVE));}catch(e){}}

/* ================== CANVAS ================== */
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const VH=540;let W=0,H=0,DPR=1,SC=1,VW=960;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);W=innerWidth;H=innerHeight;
  cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);
  SC=H/VH;VW=W/SC;
  const portrait=H>W&&matchMedia('(pointer:coarse)').matches;
  document.getElementById('rotate').classList.toggle('show',portrait);
  if(portrait&&G.mode==='play')pauseGame();
}
const PI=Math.PI,TAU=PI*2;
const clamp=(v,a,b)=>v<a?a:v>b?b:v,lerp=(a,b,t)=>a+(b-a)*t;
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

/* ================== ÂM THANH ================== */
let actx=null,master=null,noiseBuf=null,crowd=null,pad=null,soundOn=true;
function initAudio(){
  if(actx){if(actx.state==='suspended'&&G.mode!=='paused')actx.resume();return;}
  try{
    actx=new(window.AudioContext||window.webkitAudioContext)();
    master=actx.createGain();master.gain.value=soundOn?.7:0;master.connect(actx.destination);
    noiseBuf=actx.createBuffer(1,actx.sampleRate*2,actx.sampleRate);
    const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  }catch(e){actx=null;}
}
function env(g,t,a,peak,dec){g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(peak,t+a);g.gain.exponentialRampToValueAtTime(.0001,t+a+dec);}
function osc(t,type,f0,f1,dur,vol,a){
  if(!actx)return;a=a||.005;
  const o=actx.createOscillator(),g=actx.createGain();o.type=type;o.frequency.setValueAtTime(f0,t);
  if(f1)o.frequency.exponentialRampToValueAtTime(f1,t+dur);
  env(g,t,a,vol,dur);o.connect(g);g.connect(master);o.start(t);o.stop(t+a+dur+.05);

function noise(t,dur,vol,freq,q){
  if(!actx)return;

  const g=actx.createGain();env(g,t,.005,vol,dur);s.connect(f);f.connect(g);g.connect(master);

}

function drawBoat(x,y,s,team,o){

  }

    ctx.lineWidth=3;ctx.beginPath();ctx.moveTo(-8,-28);ctx.lineTo(-8+Math.cos(arm)*12,-28+Math.sin(arm)*12);ctx.stroke();
    ctx.fillStyle='#b5784e';ctx.beginPath();ctx.arc(-8,-37,4.6,0,TAU);ctx.fill();
    ctx.fillStyle=team.cap;ctx.beginPath();ctx.arc(-8,-38,5,PI,TAU);ctx.fill();
    // người lái ở đuôi
    ctx.strokeStyle=team.shirt;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-134,-6);ctx.lineTo(-136,-26);ctx.stroke();
    ctx.fillStyle='#b5784e';ctx.beginPath();ctx.arc(-136,-32,4.4,0,TAU);ctx.fill();
    ctx.fillStyle=team.cap;ctx.beginPath();ctx.arc(-136,-33,4.8,PI,TAU);ctx.fill();
    ctx.strokeStyle='#6b4a2b';ctx.lineWidth=2.4;ctx.beginPath();ctx.moveTo(-128,-24);ctx.lineTo(-176,16);ctx.stroke();
    ctx.strokeStyle=team.paddle;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(-170,11);ctx.lineTo(-178,18);ctx.stroke();
  }

  hullPath();ctx.fillStyle=team.hull;ctx.fill();

  ctx.fillStyle=team.band;ctx.fillRect(-160,1.5,330,6);

  ctx.fillStyle='rgba(0,0,0,.2)';ctx.fillRect(-160,8,330,8);
  ctx.fillStyle=team.trim;for(let k=-110;k<120;k+=46){ctx.beginPath();ctx.arc(k,4.5,1.6,0,TAU);ctx.fill();}
  ctx.restore();
  ctx.strokeStyle=team.trim;ctx.lineWidth=1.8;ctx.beginPath();ctx.moveTo(-152,-24);ctx.quadraticCurveTo(-146,-4,-126,0);ctx.lineTo(122,0);ctx.quadraticCurveTo(146,-6,156,-34);ctx.stroke();
  // đầu rắn thần Naga ở mũi
  ctx.fillStyle=team.trim;ctx.beginPath();ctx.ellipse(164,-38,10.5,6.5,-.35,0,TAU);ctx.fill();
  for(let k=0;k<3;k++){ctx.beginPath();ctx.moveTo(152+k*5,-42-k*.5);ctx.lineTo(155+k*5,-52+k*1.5);ctx.lineTo(158+k*5,-42-k);ctx.fill();}
  ctx.fillStyle='#2a160b';ctx.beginPath();ctx.arc(167,-40,1.7,0,TAU);ctx.fill();
  ctx.strokeStyle='#c0392b';ctx.lineWidth=1.4;ctx.beginPath();ctx.moveTo(172,-35);ctx.lineTo(178,-33);ctx.lineTo(176,-30);ctx.stroke();

  // mái chèo
  if(rowers){
    for(const[rx,sx,sy,p]of pts){
      const[bx,by]=bladeTip(rx,p);const hx=sx+(bx-rx)*.12,hy=sy+5;
      const dx=bx-hx,dy=by-hy,len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len;
      ctx.strokeStyle='#6b4a2b';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(hx-ux*5,hy-uy*5);ctx.lineTo(bx,by);ctx.stroke();
      ctx.strokeStyle=team.paddle;ctx.lineWidth=4.6;ctx.beginPath();ctx.moveTo(bx-ux*7,by-uy*7);ctx.lineTo(bx,by);ctx.stroke();

const parts=[];
function addSplash(x,y,n,s,lane){for(let i=0;i<n;i++)parts.push({x,y,vx:(Math.random()-.6)*60*s,vy:-(40+Math.random()*70)*s,life:.5+Math.random()*.3,t:0,r:(1+Math.random()*1.8)*s,lane});}
function updParts(dt){for(let i=parts.length-1;i>=0;i--){const p=parts[i];p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=260*dt;if(p.t>p.life)parts.splice(i,1);}}

/* ================== BỘ NHỊP ================== */
function makeBeats(bpm,total,start){return{bpm,total,made:0,next:start,list:[],lastT:-99,pulse:0,interval:60/bpm};}
function scheduleBeats(B,now,kind){
  while((!B.total||B.made<B.total)&&B.next<now+2.4){
    const b={t:B.next,judged:false,res:null,accent:B.made%4===0,passed:false};B.list.push(b);
    beatSound(kind,b);B.made++;B.interval=60/B.bpm;B.next+=B.interval;
  }
}
function beatSound(kind,b){
  if(!actx)return;const t=at(b.t);if(t<actx.currentTime)return;
  if(kind==='race'){SFX.whistle(t);SFX.drum(t,.3);if(b.accent)SFX.gong(t,.1,220);}
  else if(kind==='launch'){SFX.drum(t,.6);if(b.accent)SFX.gong(t,.16,174);}
  else{SFX.bell(t);if(b.accent)SFX.gong(t,.07,130);}
}
function tickBeats(S,now){
  const B=S.B;B.pulse=Math.max(0,B.pulse-.06);
  for(const b of B.list){
    if(!b.passed&&now>=b.t){b.passed=true;B.lastT=b.t;B.pulse=1;}
    if(!b.judged&&now>b.t+GOOD){b.judged=true;b.res='miss';judge(S,'miss',now);}
  }
  while(B.list.length&&B.list[0].t<now-1.2)B.list.shift();
}
function tap(){
  if(G.mode!=='play')return;initAudio();
  const S=G.S,now=clock();if(!S||S.over)return;
  let best=null,bd=9;for(const b of S.B.list){if(b.judged)continue;const d=Math.abs(b.t-now);if(d<bd){bd=d;best=b;}}
  if(best&&bd<=GOOD){best.judged=true;best.res=bd<=PERF?'perfect':'good';best.hitAt=now;judge(S,best.res,now);}
  else if(best&&bd<=MISSW){best.judged=true;best.res='miss';judge(S,'miss',now);}
  else{S.sync=Math.max(0,(S.sync||0)-.04);popText(S,'Vội quá!','#ffb3a0');}
}
function popText(S,txt,col){S.pop={txt,col,t:0};}
function judge(S,res,now){
  if(now<S.goT-.05&&S.type==='race'&&res==='miss')return;
  S.stat[res]++;S.total++;
  if(res==='miss'){S.combo=0;popText(S,'LỆCH NHỊP','#ff8a7a');if(actx)SFX.bad(actx.currentTime);}
  else{S.combo++;S.maxCombo=Math.max(S.maxCombo,S.combo);popText(S,res==='perfect'?'CHUẨN NHỊP!':'TỐT','#ffe28a');
    if(actx){SFX.splash(actx.currentTime,res==='perfect'?.2:.12);}
    if(S.combo>0&&S.combo%10===0)S.banner={txt:'Đồng lòng ×'+S.combo,t:0,d:1.4};}
  S.onJudge(res,now);
}

/* ================== MÀN ĐUA ================== */
function pickOpponents(n){const arr=[];for(let i=0;i<TEAMS.length&&arr.length<n;i++){const k=(SAVE.team+1+i)%TEAMS.length;if(k!==SAVE.team)arr.push(k);}return arr;}
function mkBoat(team,lane,isPlayer,base,seed){
  const r=rng(seed);return{team:TEAMS[team],lane,isPlayer,base,x:0,v:0,phase:r(),ph:r()*TAU,offs:RX.map(()=>(r()-.5)*.7),finished:false,finT:0,catchPrev:0};
}
function newRace(cfg,demo){
  const dist=cfg.dist||(SAVE.gender==='nu'?1000:1200);
  const S={type:'race',cfg,demo,dist,finish:dist*PXM,boats:[],camX:0,sprint:false,sync:.3,combo:0,maxCombo:0,stat:{perfect:0,good:0,miss:0},total:0,
    goT:3.2,started:false,over:false,order:[],banner:null,pop:null,tut:cfg.tutorial?0:-1};
  if(demo){
    S.boats.push(mkBoat(SAVE.team,3,false,11,3));S.boats.push(mkBoat((SAVE.team+2)%5,1,false,10.6,9));
    S.started=true;S.goT=-99;S.finish=1e9;
  }else{
    S.boats.push(mkBoat(SAVE.team,3,true,0,1));
    const opp=pickOpponents(cfg.opp.length);
    cfg.opp.forEach((v,i)=>S.boats.push(mkBoat(opp[i],2-i,false,v*(SAVE.gender==='nu'?.97:1),20+i*7)));
    S.B=makeBeats(cfg.bpm,0,S.goT+.45);
  }
  S.onJudge=(res)=>{
    const P=S.boats[0];
    if(res==='perfect'){S.sync=Math.min(1,S.sync+.1);P.v+=.6;}
    else if(res==='good'){S.sync=Math.min(1,S.sync+.04);}
    else S.sync=Math.max(0,S.sync-.18);
    if(S.combo&&S.combo%10===0)S.sync=Math.min(1,S.sync+.05);
  };
  return S;
}
function updRace(S,dt,now){
  if(!S.demo){
    if(!S.started&&now>=S.goT){S.started=true;S.banner={txt:'XUẤT PHÁT!',t:0,d:1.1};if(actx){SFX.gong(actx.currentTime,.25,196);SFX.cheer(actx.currentTime);}setCrowd(.09);}
    if(!S.over){scheduleBeats(S.B,now,'race');tickBeats(S,now);}
    if(S.cnt===undefined)S.cnt=3;
    const left=S.goT-now;if(left>0&&left<S.cnt){if(actx)SFX.drum(actx.currentTime,.5);S.cnt--;}
  }
  const P=S.boats[0];
  for(const b of S.boats){
    let target=0;
    if(S.started){
      if(b.isPlayer){target=S.over?2:(5+S.sync*15)*(S.sprint?1.1:1);}
      else{
        const sp=b.x>=S.finish*.75;let m=1+.05*Math.sin(now*.8+b.ph)+.02*Math.sin(now*2.3+b.ph*2);
        if(!S.demo&&P){const d=(b.x-P.x)/PXM;if(d<-50)m*=1.05;else if(d>70)m*=.96;}
        target=b.finished?3:b.base*m*(sp?1.07:1);
      }
    }
    b.v+=(target-b.v)*Math.min(1,dt*(b.isPlayer?1.4:.9));
    b.x+=b.v*PXM*dt;
    // nhịp chèo
    if(b.isPlayer){
      const B=S.B;b.phase=B.lastT<0?.7:clamp((now-B.lastT)/B.interval,0,.999);b.desync=Math.pow(1-S.sync,1.4)*.9;
    }else{b.phase+=dt*(b.v>1?(0.85+b.v/22):.15);b.desync=.07;}

    const ph=((b.phase%1)+1)%1;
    if(b.v>2&&b.catchPrev>.85&&ph<.15){const L=LANES[b.lane];const s=L.s;
      for(let i=0;i<RX.length;i+=3)addSplash(b.x+(RX[i]+16)*1,17,2,s,b.lane);}
    b.catchPrev=ph;
    if(!S.demo&&!b.finished&&b.x>=S.finish){b.finished=true;b.finT=now;S.order.push(b);}
  }
  if(!S.demo){
    if(!S.sprint&&P.x>=S.finish*.75){S.sprint=true;S.B.bpm=S.cfg.sprintBpm;S.banner={txt:'NƯỚC RÚT! Nhịp nhanh hơn',t:0,d:1.8};setCrowd(.16);}
    if(P.finished&&!S.over){S.over=true;S.endAt=now+1.6;if(actx)SFX.cheer(actx.currentTime);}
    if(S.over&&now>=S.endAt&&!S.resulted){S.resulted=true;finishStage();}
    if(S.tut>=0){const n=S.stat.perfect+S.stat.good;S.tut=now<S.goT?0:n<3?1:n<10?2:3;}
  }

}

function newLaunch(cfg){

    if(S.prog>=1){S.B.total=S.B.made;S.B.list=S.B.list.filter(b=>b.judged);}};
  return S;

function launchPos(p){
  const A={x:VW*.2,y:288},B={x:VW*.36,y:288},C={x:VW*.78,y:432};
  if(p<.35){const q=p/.35;return{x:lerp(A.x,B.x,q),y:A.y,a:0};}
  const q=(p-.35)/.65,ang=Math.atan2(C.y-B.y,C.x-B.x);
  return{x:lerp(B.x,C.x,q),y:lerp(B.y,C.y,q),a:ang*Math.min(1,q*5)*(q>.85?(1-q)/.15:1)};
}
const LX=()=>[VW*.36+140,VW*.6];

  txt(st.name,16,46,18,'#fff4dc','left',800);
  if(S.type==='race'){
    const P=S.boats[0],x0=VW*.3,w=VW*.4;
    bar(x0,16,w,10,0,'#000','#000');
    for(const b of [...S.boats].reverse()){const X=x0+w*clamp(b.x/S.finish,0,1);ctx.fillStyle=b.team.shirt;ctx.beginPath();ctx.arc(X,21,b.isPlayer?8:6,0,TAU);ctx.fill();if(b.isPlayer){ctx.strokeStyle='#fff';ctx.lineWidth=2;ctx.stroke();}}
    ctx.fillStyle='#fff';ctx.fillRect(x0+w-2,10,3,22);
    const rem=Math.max(0,Math.ceil((S.finish-P.x)/PXM));txt('Còn '+rem+' m',x0+w,46,13,'#fff4dc','right',600);
    txt('ĐỒNG LÒNG',x0,46,11,'#ffd66b','left',800);
    bar(x0,52,w*.55,9,S.sync,'#e8432c','#ffd66b');
    if(S.boats.length>1){let rank=1;for(const b of S.boats)if(b!==P&&(b.finished&&(!P.finished||b.finT<P.finT)||(!b.finished&&!P.finished&&b.x>P.x)))rank++;
      txt('HẠNG',VW-112,26,11,'#ffd66b','right',800);txt(rank+'/'+S.boats.length,VW-112,52,26,'#fff4dc','right',900);}
  }else if(S.type==='launch'){
    const x0=VW*.3,w=VW*.4;txt('ĐƯA GHE XUỐNG SÔNG',x0,12+0,11,'#ffd66b','left',800);bar(x0,18,w,11,S.shown,'#c0392b','#ffd66b');
  }else{
    const x0=VW*.3,w=VW*.4;txt('ĐÈN NƯỚC: '+S.lanterns.length+' / '+S.cfg.beats,x0,14,12,'#ffd66b','left',800);bar(x0,20,w,10,S.lanterns.length/S.cfg.beats,'#ff9fc9','#ffd66b');
  }
  drawTrack(S,now);
  // đếm ngược
  const left=S.goT-now;if(left>0&&left<3.2){const n=Math.ceil(left);const k=1+(n-left)*.3;ctx.save();ctx.translate(VW/2,215);ctx.scale(k,k);ctx.globalAlpha=clamp(left-(n-1),0,1)*.9+.1;txt(String(Math.min(3,n)),0,0,86,'#ffd66b','center',900);ctx.restore();ctx.globalAlpha=1;}
  if(S.banner){S.banner.t+=1/60;const b=S.banner,a=clamp(Math.min(b.t/.2,(b.d-b.t)/.3),0,1);if(b.t>b.d)S.banner=null;else{ctx.globalAlpha=a;ctx.font='900 26px "Be Vietnam Pro"';const tw=ctx.measureText(b.txt).width+60;ctx.fillStyle='rgba(122,29,16,.88)';roundRect(VW/2-tw/2,150,tw,46,23);ctx.fill();ctx.strokeStyle='#e8b33a';ctx.lineWidth=2;ctx.stroke();txt(b.txt,VW/2,182,26,'#ffd66b','center',900);ctx.globalAlpha=1;}}
  // hướng dẫn màn tập
  let tip=null;
  if(S.type==='race'&&S.tut>=0)tip=['Nghe còi của người chỉ huy và nhìn thanh nhịp phía dưới','Chạm màn hình (hoặc phím Space) khi nốt vàng trùng vòng tròn','Đúng nhịp liên tục: cả ghe đồng lòng, ghe lướt nhanh hơn','Lệch nhịp: tay chèo rối, ghe chậm lại. Giữ nhịp tới đích!'][S.tut];
  if(S.type==='launch'&&!S.started)tip='Chạm đúng nhịp trống để cả xóm cùng đẩy ghe';
  if(S.type==='lantern'&&!S.started)tip='Chạm đúng tiếng chuông để thả đèn nước';
  if(tip){ctx.font='600 15px "Be Vietnam Pro"';const tw=Math.min(VW-40,ctx.measureText(tip).width+36);ctx.fillStyle='rgba(30,10,6,.72)';roundRect(VW/2-tw/2,92,tw,36,18);ctx.fill();txt(tip,VW/2,115,15,'#fff4dc','center',600);}
}

/* ================== LUỒNG GAME ================== */
let demo=newRace({opp:[]},true);
function startStage(i){
  initAudio();parts.length=0;G.si=i;const cfg=STAGES[i];
  G.S=cfg.type==='race'?newRace(cfg,false):cfg.type==='launch'?newLaunch(cfg):newLantern(cfg);
  G.scene=cfg.type;G.t0=now0();G.fakeT=0;
  stopCrowd();stopPad();
  if(cfg.type==='race')startCrowd(.05);else if(cfg.type==='launch')startCrowd(.03);else startPad();
  setMode('play');
}
function finishStage(){
  const S=G.S,st=STAGES[G.si];let stars=0,title='',kicker=st.name;
  const acc=S.total?(S.stat.perfect+S.stat.good*.6)/S.total:0;
  const stats=[];
  if(S.type==='race'){
    const P=S.boats[0];
    if(S.boats.length>1){const rank=S.order.indexOf(P)+1;stars=[0,3,2,1,0][rank];title=rank===1?'Về nhất!':'Về hạng '+rank;stats.push(['Hạng',rank+'/'+S.boats.length]);}
    else{stars=acc>=.85?3:acc>=.6?2:1;title='Hoàn thành buổi tập';}
    stats.push(['Thời gian',(P.finT-S.goT).toFixed(1)+' s']);
  }else if(S.type==='launch'){stars=acc>=.85?3:acc>=.6?2:acc>=.3?1:0;title=stars?'Ghe đã xuống nước':'Cả xóm phải đẩy giúp';}
  else{stars=acc>=.85?3:acc>=.6?2:acc>=.3?1:0;title=S.lanterns.length+' đèn nước đã thả';}
  stats.push(['Chuẩn nhịp',Math.round(acc*100)+'%'],['Chuỗi dài nhất',S.maxCombo]);
  const first=!SAVE.cards[G.si]&&stars>0;
  if(stars>0){SAVE.stars[G.si]=Math.max(SAVE.stars[G.si],stars);SAVE.cards[G.si]=true;save();}
  document.getElementById('resKicker').textContent=kicker;
  document.getElementById('resTitle').textContent=stars?title:title+' – thử lại nhé';
  document.getElementById('resStars').innerHTML=[0,1,2].map(i=>'<span class="'+(i<stars?'':'off')+'">★</span>').join('');
  document.getElementById('resStats').innerHTML=stats.map(s=>'<div><b>'+s[1]+'</b>'+s[0]+'</div>').join('');
  const nb=document.getElementById('resNext');
  nb.style.display=stars?'':'none';nb.textContent=first?'Mở thẻ văn hóa mới':'Xem thẻ văn hóa';
  setCrowd(.04);setMode('result');
}
function openCard(i,mode){
  G.cardIdx=i;G.cardMode=mode;const c=CARDS[i];
  document.getElementById('cardKicker').textContent='Thẻ văn hóa '+(i+1)+'/'+CARDS.length;
  document.getElementById('cardTitle').textContent=c.title;
  document.getElementById('cardBody').textContent=c.body;
  document.getElementById('cardDyk').innerHTML=c.dyk;
  document.getElementById('cardBackBtn').style.display=mode==='album'?'':'none';
  setMode('card');
}
function openQuiz(){
  const c=CARDS[G.cardIdx];
  document.getElementById('quizQ').textContent=c.q;
  const box=document.getElementById('quizOpts');box.innerHTML='';
  document.getElementById('quizFb').textContent='';
  const nx=document.getElementById('quizNext');nx.disabled=true;
  c.opts.forEach((o,i)=>{const b=document.createElement('button');b.className='opt';b.textContent=o;b.onclick=()=>{
    if(!nx.disabled)return;
    [...box.children].forEach((el,j)=>{if(j===c.ans)el.classList.add('ok');});
    if(i!==c.ans)b.classList.add('no');
    document.getElementById('quizFb').innerHTML=(i===c.ans?'<b>Chính xác!</b> ':'<b>Chưa đúng.</b> ')+c.ex;
    if(actx)(i===c.ans?SFX.ok:SFX.bad)(actx.currentTime);
    nx.disabled=false;};box.appendChild(b);});
  setMode('quiz');
}
function renderTeams(){
  const el=document.getElementById('teamList');el.innerHTML='';
  TEAMS.forEach((t,i)=>{const d=document.createElement('div');d.className='team'+(i===SAVE.team?' sel':'');
    d.innerHTML='<div class="sw" style="background:'+t.hull+'"><i style="background:'+t.band+'"></i></div>'+t.name;
    d.onclick=()=>{SAVE.team=i;save();renderTeams();demo=newRace({opp:[]},true);};el.appendChild(d);});
  document.querySelectorAll('#genderSeg button').forEach(b=>{b.classList.toggle('sel',b.dataset.g===SAVE.gender);b.onclick=()=>{SAVE.gender=b.dataset.g;save();renderTeams();};});
}
function renderStages(){
  const el=document.getElementById('stageList');el.innerHTML='';
  STAGES.forEach((s,i)=>{const lock=i>0&&!SAVE.stars[i-1];const d=document.createElement('div');d.className='stage'+(lock?' lock':'');
    const st=SAVE.stars[i];
    d.innerHTML='<div class="st">'+'★'.repeat(st)+'<span style="opacity:.25">'+'★'.repeat(3-st)+'</span></div><div class="n">MÀN '+(i+1)+'</div><div class="t">'+s.name+'</div><div class="d">'+(lock?'Hoàn thành màn trước để mở':s.desc)+'</div>';
    if(!lock)d.onclick=()=>startStage(i);el.appendChild(d);});
}
function renderAlbum(){
  const el=document.getElementById('albumList');el.innerHTML='';
  CARDS.forEach((c,i)=>{const b=document.createElement('button');const ok=SAVE.cards[i];
    b.innerHTML=(i+1)+'. '+(ok?c.title:'Thẻ chưa mở')+'<span>'+(ok?'Bấm để đọc lại':'Hoàn thành màn "'+STAGES[i].name+'" để mở')+'</span>';
    b.disabled=!ok;b.onclick=()=>openCard(i,'album');el.appendChild(b);});
}
const OVS=['menu','setup','stages','result','card','quiz','album','pause'];
function setMode(m){
  G.mode=m;OVS.forEach(id=>document.getElementById(id).classList.toggle('show',id===m));
  document.getElementById('pauseBtn').style.display=m==='play'?'block':'none';
  if(m==='stages'){renderStages();G.scene='demo';stopPad();stopCrowd();}
  if(m==='setup')renderTeams();
  if(m==='album')renderAlbum();
  if(m==='menu'||m==='setup')G.scene='demo';
}
function pauseGame(){if(G.mode!=='play')return;setMode('pause');G.mode='paused';document.getElementById('pause').classList.add('show');if(actx)actx.suspend();}
function resumeGame(){document.getElementById('pause').classList.remove('show');G.mode='play';document.getElementById('pauseBtn').style.display='block';if(actx)actx.resume();}

document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');if(!a)return;const act=a.dataset.act;initAudio();
  if(act==='start')setMode(SAVE.cards.some(Boolean)?'stages':'setup');
  else if(act==='toStages'){if(actx&&actx.state==='suspended')actx.resume();setMode('stages');}
  else if(act==='setup')setMode('setup');
  else if(act==='album'){G.ret=G.mode;setMode('album');}
  else if(act==='albumClose')setMode(G.ret==='menu'?'menu':'stages');
  else if(act==='albumBack')setMode('album');
  else if(act==='retry'){if(actx&&actx.state==='suspended')actx.resume();startStage(G.si);}
  else if(act==='toCard')openCard(G.si,'stage');
  else if(act==='toQuiz')openQuiz();
  else if(act==='quizDone')setMode(G.cardMode==='album'?'album':'stages');
  else if(act==='resume')resumeGame();
});
document.getElementById('pauseBtn').onclick=e=>{e.stopPropagation();pauseGame();};
document.getElementById('soundBtn').onclick=e=>{e.stopPropagation();initAudio();soundOn=!soundOn;if(master)master.gain.value=soundOn?.7:0;e.currentTarget.style.opacity=soundOn?1:.4;};
cv.addEventListener('pointerdown',e=>{if(G.mode==='play'){e.preventDefault();tap();}});
addEventListener('keydown',e=>{
  if(e.code==='Space'||e.code==='Enter'||e.code==='ArrowUp'||e.code==='KeyJ'||e.code==='KeyF'){if(G.mode==='play'){e.preventDefault();if(!e.repeat)tap();}}
  if(e.code==='Escape'||e.code==='KeyP'){if(G.mode==='play')pauseGame();else if(G.mode==='paused')resumeGame();}
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseGame();});
addEventListener('resize',resize);

/* ================== VÒNG LẶP ================== */
G.cloud=0;G.tw=0;let last=performance.now();
function frame(t){
  let dt=Math.min(.05,(t-last)/1000);last=t;
  const playing=G.mode==='play'||(G.S&&(G.mode==='result'||G.mode==='card'||G.mode==='quiz'));
  if(G.mode!=='paused'){G.cloud+=dt;G.tw+=dt;}
  ctx.setTransform(DPR*SC,0,0,DPR*SC,0,0);
  ctx.clearRect(0,0,VW,VH);
  if(G.mode==='paused'){drawScene(clock());}
  else{
    if(G.mode==='play')G.fakeT+=dt;
    updParts(dt);
    if(G.scene==='demo'){updRace(demo,dt,performance.now()/1000);}
    else if(playing&&G.S){const now=clock();const S=G.S;
      if(S.type==='race')updRace(S,dt,now);else if(S.type==='launch')updLaunch(S,dt,now);else updLantern(S,dt,now);}
    drawScene(clock());
  }
  requestAnimationFrame(frame);
}
function drawScene(now){
  if(G.scene==='demo'||!G.S){drawRace(demo,performance.now()/1000);return;}
  const S=G.S;
  if(S.type==='race')drawRace(S,now);else if(S.type==='launch')drawLaunch(S,now);else drawLantern(S,now);
  if(G.mode==='play'||G.mode==='paused')drawHUD(S,now);
}
window.__G=G;window.__tap=tap;window.__clock=clock;window.__start=startStage;
resize();requestAnimationFrame(frame);
</script>
